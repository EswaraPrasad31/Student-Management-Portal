<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Profile</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="profile-page">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img
            src="./images/cvr.webp"
            alt="College Logo"
            width="60"
            height="60"
            class="rounded-pill"
          />
          <span class="ms-3 fw-bold text-primary fs-4">
            CVR College of Engineering
          </span>
        </a>

        <div class="ms-auto">
          <a href="index.html" class="btn btn-outline-primary">
            Back to Home
          </a>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div class="profile-card">
        <img src="./images/profile.png" alt="Profile" class="profile-image" />

        <h2 class="profile-name" id="profileName"></h2>

        <div class="info-box">
          <strong>Roll Number:</strong>
          <span id="profileRoll"></span>
        </div>

        <div class="info-box">
          <strong>Branch:</strong>
          <span id="profileBranch"></span>
        </div>

        <div class="info-box">
          <strong>Email:</strong>
          <span id="profileEmail"></span>
        </div>

        <div class="info-box">
          <strong>Mobile Number:</strong>
          <span id="profileMobile"></span>
        </div>
      </div>
    </div>
    <script>
      document.getElementById("profileName").textContent =
        localStorage.getItem("studentName");

      document.getElementById("profileRoll").textContent =
        localStorage.getItem("rollNumber");

      document.getElementById("profileBranch").textContent =
        localStorage.getItem("branch");

      document.getElementById("profileEmail").textContent =
        localStorage.getItem("email");

      document.getElementById("profileMobile").textContent =
        localStorage.getItem("mobile");
        
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
